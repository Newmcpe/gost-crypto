[package]
name = "gost-crypto"
version = "0.2.1"
edition = "2021"
description = "GOST 28147-89 block cipher and GOST R 34.11-94 hash — no_std, RustCrypto compatible"
license = "WTFPL"
readme = "README.md"
repository = "https://github.com/Newmcpe/gost-crypto"
keywords = ["gost", "crypto", "cipher", "hash", "no-std"]
categories = ["cryptography", "no-std"]

[dependencies]
digest = { version = "0.10", default-features = false }
cipher = { version = "0.4", default-features = false }
cmac   = { version = "0.7", default-features = false, optional = true }
hmac   = { version = "0.12", default-features = false, optional = true }
streebog = { version = "0.10", default-features = false, optional = true }
kuznyechik = { version = "0.9.0-rc.3", default-features = false, optional = true }

[features]
default = []
# Enable MAC (CMAC/OMAC via cmac crate) for Gost28147
mac      = ["dep:cmac"]
# Re-export Streebog (GOST R 34.11-2012) from the streebog crate
streebog = ["dep:streebog"]
# Re-export Kuznyechik (GOST R 34.12-2015) from the kuznyechik crate
kuznyechik = ["dep:kuznyechik"]
# HMAC over Streebog-256 and Streebog-512 (RFC 7836)
hmac-streebog = ["dep:hmac", "streebog"]
# std support
std = ["digest/std", "cipher/std"]

[dev-dependencies]
hex-literal = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }
cbc      = "0.1"
ctr      = "0.9"
cfb-mode = "0.8"
ofb      = "0.6"

[[bench]]
name = "gost"
harness = false

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all       = { level = "deny", priority = 10 }
pedantic  = { level = "warn", priority = 3 }
